# Build and deploy Node.js app to Azure Web App - room-master

name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Install production dependencies
        run: |
          rm -rf node_modules
          yarn install --production --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Zip for deployment
        run: |
          zip -r release.zip . \
            -x "*.git*" \
            "src/*" \
            "tests/*" \
            "scripts/*" \
            "docs/*" \
            ".github/*" \
            "docker-compose*" \
            "Dockerfile*" \
            "terraform/*" \
            ".env*" \
            "*.log" \
            ".vscode/*" \
            ".idea/*" \
            "*.md" \
            ".eslintrc*" \
            ".prettierrc*" \
            "jest.config*" \
            "tsconfig*.json" \
            "nodemon.json" \
            ".dockerignore" \
            ".gitignore" \
            ".husky/*" \
            "coverage/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E13EA904B2CF477685108DE5B1999A36 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0021EC3C95964AF2A2191185AB6D59D6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5DA2A0FA69CD4DED96B16ADDE8FD1830 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'room-master'
          slot-name: 'Production'
          package: release.zip
